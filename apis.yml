apis:
- name: StreetMetrics Public API
  description: >-
    Public REST API for the StreetMetrics out-of-home advertising platform. 54 operations across
    campaigns, transit and stationary ad groups, assets and asset owners, frames, creatives, markets,
    media and product types, attribution studies (including conversion rollups by date, ad group and
    unit), conversion pixels, and reporting (impressions by date/ad group/unit, demographics,
    affinities, uniques and frequency). Authentication is a JWT bearer token obtained by POSTing
    StreetMetrics platform credentials to /auth/authenticate.
  humanURL: https://docs.streetmetrics.com/reference/ad-groups
  baseURL: https://dashboard.streetmetrics.io/v3/public/
