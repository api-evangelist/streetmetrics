name: StreetMetrics
description: StreetMetrics is an out-of-home (OOH) advertising measurement, planning, and attribution
  platform that gives operators, agencies, and brands data-driven tools to plan campaigns, track delivery
  in near real-time across 1.6M+ OOH units, and measure business outcomes from outdoor advertising. Its
  SmartSearch planning intelligence surfaces unit-level performance and audience insights, daily-refreshed
  impression measurement tracks delivery, and attribution connects OOH exposure to website visits, app
  opens, and in-store lift. StreetMetrics publishes a public REST API — the StreetMetrics Public API,
  documented at docs.streetmetrics.com and served from dashboard.streetmetrics.io/v3/public/ — covering
  campaigns, ad groups, assets, frames, creatives, markets, media, attribution studies, conversion
  pixels, and impression/demographic/uniques-and-frequency reporting. Authentication is a JWT bearer
  token minted from the same email and password used to sign in to the StreetMetrics platform, so API
  access follows a platform subscription rather than self-serve developer signup.
