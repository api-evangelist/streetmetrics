name: StreetMetrics
description: StreetMetrics is an out-of-home (OOH) advertising measurement, planning, and attribution
  platform that gives operators, agencies, and brands data-driven tools to plan campaigns, track delivery
  in near real-time across 1.6M+ OOH units, and measure business outcomes from outdoor advertising. Its
  SmartSearch planning intelligence surfaces unit-level performance and audience insights, daily-refreshed
  impression measurement tracks delivery, and attribution connects OOH exposure to website visits, app
  opens, and in-store lift. No public developer API, SDKs, or API documentation are published; access is
  delivered through the product platform (Intelligence, Measurement, Attribution, StreetCity) and verified
  partner operators.
