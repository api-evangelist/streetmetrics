api: StreetMetrics Public API
summary: >-
  The model is an out-of-home campaign hierarchy hung off physical inventory. A Campaign holds Ad Groups
  (called "flights" in the payloads); an Ad Group is either transit — carrying Assets (vehicles) — or
  stationary — carrying Frames (billboard faces); both can carry Creatives. Media describes the product
  a face belongs to and is broken into Media Faces. Measurement attaches sideways: Attribution Studies
  bind to a Campaign and are fed by conversion Pixels, and Reporting is a set of read-only rollups
  (impressions, demographics, affinities, uniques-and-frequency) keyed by campaign, ad group or unit.
id_conventions:
  style: numeric surrogate ids plus an operator-supplied external reference on most entities
  pairs:
  - entity: Campaign
    id: campaignId
    external_ref: campaignRef
  - entity: Ad Group
    id: flightId
    external_ref: flightRef
    note: The path/resource is `ad-groups` but the payload field is `flightId` — the two vocabularies
      are not reconciled anywhere in the docs.
  - entity: Frame
    id: frameId
    external_ref: frameRef
  - entity: Media
    id: mediaId
    external_ref: classRef
  - entity: Asset
    id: null
    external_ref: assetRef
    note: Assets expose no numeric id in the client entity — assetRef/classRef are the handles.
  - entity: Creative
    id: creativeId
    external_ref: creativeRef
  - entity: Market
    id: marketId
  - entity: Pixel
    id: pixelId
    external_ref: pixelUUID
  - entity: Attribution Study
    id: attributionId
