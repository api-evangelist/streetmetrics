notes:
- Relationships are expressed through attach/detach operations and id fields rather than hypermedia;
  there are no links in any response.
- Every list response wraps its payload in the {statusCode, message, meta, data} envelope, so the entity
  schemas above are the contents of `data`.
- The `metaData` field is an untyped object on Campaign, Ad Group, Asset and Pixel — an extension point
  the contract does not describe.
