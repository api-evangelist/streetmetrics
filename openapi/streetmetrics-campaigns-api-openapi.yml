components:
  schemas:
    ClientCampaignEntityResponseDto:
      type: object
      properties:
        campaignId:
          type: number
          example: 1
          description: The ID of the campaign
        campaignRef:
          type: string
          example: CMP12345
          description: The reference code of the campaign
        contractId:
          type: string
          example: CON12345
          description: The reference code of the contract
        industry:
          type: string
          example: Automotive
          description: The industry of the campaign
        activeFrom:
          type: number
          example: 1625097600
          description: The start date of the campaign
        activeTo:
          type: number
          example: 1625097600
          description: The end date of the campaign
        metaData:
          type: object
          example:
            advertiser: StreetMetrics
          description: The metadata of the campaign
        createdAt:
          format: date-time
          type: string
          example: '2023-07-29T12:34:56Z'
          description: The date and time the campaign was created
        updatedAt:
          format: date-time
          type: string
          example: '2023-08-01T15:22:11Z'
          description: The date and time the campaign was last updated
        adGroups:
          description: The ad groups of the campaign
          type: array
          items:
            type: object
      required:
      - campaignId
      - campaignRef
      - contractId
      - industry
      - activeFrom
      - activeTo
      - metaData
      - createdAt
      - updatedAt
    CreateCampaignDto:
      type: object
      properties:
        campaignRef:
          type: string
          example: CMP12345
          description: The reference code of the campaign
        advertiser:
          type: string
          example: Advertiser Name
          description: The advertiser of the campaign
        marketId:
          minItems: 1
          example:
          - 1
          - 2
          - 3
          description: The market IDs of the campaign
          type: array
          items:
            type: number
            maximum: 2147483647
            minimum: 1
        contractId:
          type: string
          example: CON12345
          description: The reference code of the contract
        industry:
          type: string
          example: Automotive
          description: The industry of the campaign
          enum:
          - Alcohol
          - Automotive, Dealers & Services
          - Cannabis
          - Consumer Goods
          - Education
          - Employment
          - Entertainment
          - Financial
          - Government, Politics & Organizations
          - Healthcare
          - Insurance
          - Lottery
          - Legal
          - Non-Profit
          - Other
          - Real Estate
          - Restaurants
          - Retail
          - Service Providers
          - Technology
          - Travel
          - Utilities
        goal:
          type: number
          minimum: 0
          example: 1000
          description: The goal of the campaign
        activeFrom:
          type: number
          example: 1625097600
          description: 'The start date of the campaign (NOTE: Please refrain from passing this value directly, as it will automatically be set each day based on its ad groups)'
        activeTo:
          type: number
          example: 1625097600
          description: 'The end date of the campaign (NOTE: Please refrain from passing this value directly, as it will automatically be set each day based on its ad groups)'
        displayName:
          type: string
          example: Campaign Display Name
          description: The display name of the campaign
        budget:
          type: number
          minimum: 0
          example: 1000
          description: The budget of the campaign
        cpm:
          type: number
          minimum: 0
          example: 1000
          description: The CPM of the campaign
      required:
      - campaignRef
      - advertiser
      - marketId
    ErrorResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Status of the response
          example: error
        statusCode:
          type: number
          description: HTTP status code
          example: 400
        errorCode:
          type: string
          description: Custom error code
          example: ERR001
        message:
          type: string
          description: Error message
          example: Invalid input data
        details:
          type:
          - object
          - 'null'
          description: Additional details about the error
        timestamp:
          type: string
          description: Timestamp of the error
          example: '2024-08-26T14:56:29.000Z'
        path:
          type: string
          description: Request path where the error occurred
          example: /api/v1/resource
      required:
      - status
      - statusCode
      - errorCode
      - message
      - details
      - timestamp
      - path
    GetCampaignsResponseDto:
      type: object
      properties:
        statusCode:
          type: number
        message:
          type: string
        meta:
          type: object
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClientCampaignEntityResponseDto'
      required:
      - statusCode
      - meta
      - data
    CreateCampaignResponse:
