openapi: 3.2.0
info:
  title: Streetmetrics Reporting API
  version: '3.0'
  contact: {}
  description: 'Operations tagged Reporting across 2 of this provider''s published API definitions: streetmetrics-public-api-docs-json.json, streetmetrics-public-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dashboard.streetmetrics.io/v3/public/
tags:
- name: Reporting
paths:
  /public/reporting/impressions/date:
    get:
      operationId: ReportingController_getImpressionsByDate
      parameters:
      - name: marketId
        required: false
        in: query
        description: The ID of the market
        schema:
          type: number
      - name: startDate
        required: true
        in: query
        description: Start date as Unix timestamp
        schema:
          type: number
      - name: endDate
        required: true
        in: query
        description: End date as Unix timestamp
        schema:
          type: number
      - name: campaignId
        required: true
        in: query
        description: The ID of the campaign
        schema:
          type: number
      - name: summaryBin
        required: true
        in: query
        description: Summary bin for grouping data
        schema:
          type: string
          enum:
          - LIFETIME
          - WEEK
          - MONTH
          - DAY
          - HOUR
          - DOW
      - name: timezone
        required: false
        in: query
        description: Timezone for date calculations
        schema:
          type: string
      responses:
        '200':
          description: Impressions data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetImpressionsByDateResponseDto'
        '204':
          description: No Impressions found
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Retrieve impressions data grouped by date
      tags:
      - Reporting
    servers:
    - url: https://dashboard.streetmetrics.io/v3/public/
