components:
  schemas:
    ClientReportingImpressionsByAdGroupResponseDto:
      type: object
      properties:
        adGroupId:
          type: number
          example: 1
          description: The ID of the ad group
        adGroupRef:
          type: string
          example: ADG12345
          description: The reference code of the ad group
        impressions:
          type: number
          example: 500
          description: Number of impressions for the ad group
        summaryBinGrouping:
          type: object
          example: LIFETIME
          description: The summary bin date grouping
        impressionsLts:
          type: number
          example: 100
          description: Number of LTS impressions for the given ad group. Currently available for stationary, only.
        impressionsOts:
          type: number
          example: 200
          description: Number of OTS impressions for the given ad group. Currently available for stationary, only.
      required:
      - adGroupId
      - adGroupRef
      - impressions
      - summaryBinGrouping
      - impressionsLts
      - impressionsOts
    ClientReportingImpressionsByUnitResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: The ID of the unit
        ref:
          type: string
          example: ADG12345
          description: The reference code of the unit
        type:
          type: string
          example: ASSET
          description: ASSET or FRAME
        impressions:
          type: number
          example: 200
          description: Number of impressions for the unit
        rollupTimestamp:
          type: number
          example: 1672531200
          description: The rollup timestamp for the summary bin date grouping
        summaryBinGrouping:
          type: string
          example: '2021-01-01'
          description: The summary bin date grouping
        impressionsLts:
          type: number
          example: 100
          description: Number of LTS impressions for the given unit. Currently available for stationary, only.
        impressionsOts:
          type: number
          example: 200
          description: Number of OTS impressions for the given unit. Currently available for stationary, only.
      required:
      - id
      - ref
      - type
      - impressions
      - rollupTimestamp
      - summaryBinGrouping
      - impressionsLts
      - impressionsOts
    ClientReportingUfResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: The ID of the campaign
        ref:
          type: string
          example: ADG12345
          description: The reference code of campaign
        date:
          type: string
          example: '2021-01-01'
          description: The date of the uniques and frequency data
        uniquesGross:
          type: number
          example: 100
          description: The number of uniques gross
        frequencyGross:
          type: number
          example: 100
          description: The number of frequency gross
        uniquesOts:
          type: number
          example: 100
          description: The number of uniques OTS
        frequencyOts:
          type: number
          example: 100
          description: The number of frequency OTS
        uniquesLts:
          type: number
          example: 100
          description: The number of uniques LTS
        frequencyLts:
          type: number
          example: 100
          description: The number of frequency LTS
      required:
      - id
      - ref
      - date
      - uniquesGross
      - frequencyGross
      - uniquesOts
      - frequencyOts
      - uniquesLts
      - frequencyLts
    GetAffinitiesResponseDto:
      type: object
      properties:
        statusCode:
          type: number
        message:
          type: string
        meta:
          type: object
        data:
          description: Affinities data grouped by campaign
          type: array
          items:
            $ref: '#/components/schemas/ClientReportingAffinitiesResponseDto'
      required:
      - statusCode
      - meta
      - data
    ClientReportingUfResponseDtoAdgroup:
