openapi: 3.2.0
info:
  title: Streetmetrics Assets API
  version: '3.0'
  contact: {}
  description: 'Operations tagged Assets across 2 of this provider''s published API definitions: streetmetrics-public-api-docs-json.json, streetmetrics-public-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dashboard.streetmetrics.io/v3/public/
tags:
- name: Assets
paths:
  /public/assets/{id}:
    get:
      operationId: AssetController_getAssetById
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: number
      responses:
        '200':
          description: Successful retrieval of asset
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Get asset by ID
      tags:
      - Assets
    patch:
      operationId: AssetController_patchUpdateAsset
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPatchUpdateDto'
      responses:
        '200':
          description: Successful patch update of asset
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Update asset
      tags:
      - Assets
    servers:
    - url: https://dashboard.streetmetrics.io/v3/public/
  /public/assets:
    get:
      operationId: AssetController_getAssets
      parameters:
      - name: limit
        required: false
        in: query
        description: Limit the number of results
        schema:
          type: number
      - name: sort
        required: false
        in: query
        description: Field to sort by
        schema:
