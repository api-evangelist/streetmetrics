components:
  schemas:
    AssetPatchUpdateDto:
      type: object
      properties:
        assetOwner:
          type: string
          description: The owner of the asset.
        assetType:
          enum:
          - DEFAULT
          - BIKE
          - BUS
          - CAR
          - MOBILE_BILLBOARD
          - PEDI_CAB
          - TRUCK
          - SCOOTER
          - TAXI
          - LIGHT_RAIL
          - BOX_VAN
          - SEMI_TRAILER
          - TROLLEY
          - DOUBLE_DECKER
          - TOUR_BUS
          - DELIVERY_TRUCK
          - STATIONARY
          type: string
          description: The type of the asset.
        assetRef:
          type: string
          description: The asset identifier as it appears through the API feed.
        classRef:
          type: string
          description: The class associated with the asset - this defined the media products the asset can support
        displayName:
          type: string
          description: The name of the asset as it will appear in the StreetMetrics platform.
        assetStatus:
          enum:
          - ACTIVE
          - INACTIVE
          - RETIRED
          type: string
          description: The status of the asset.
    ErrorResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Status of the response
          example: error
        statusCode:
          type: number
          description: HTTP status code
          example: 400
        errorCode:
          type: string
          description: Custom error code
          example: ERR001
        message:
          type: string
          description: Error message
          example: Invalid input data
        details:
          type:
          - object
          - 'null'
          description: Additional details about the error
        timestamp:
          type: string
          description: Timestamp of the error
          example: '2024-08-26T14:56:29.000Z'
        path:
          type: string
          description: Request path where the error occurred
          example: /api/v1/resource
      required:
      - status
      - statusCode
      - errorCode
      - message
      - details
      - timestamp
      - path
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
