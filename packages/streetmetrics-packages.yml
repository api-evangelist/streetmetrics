summary: >-
  StreetMetrics publishes no client SDK for the Public API in any language. The documentation offers
  only cURL examples and the ReadMe try-it console; there is no SDK, quickstart-with-a-library, or
  code-generation guidance. The company's GitHub organization is real and public but holds
  infrastructure work, not API clients: one first-party Angular Mapbox binding (archived, never
  published to npm) and four forks of third-party open-source projects. No SDKs pointer is claimed in
  apis.yml because no API client library exists to claim.
